# MySQL Workbench profile — Local MySQL 8.0 Server (scroll_master)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/scroll_master?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Mohamed123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=false

# OpenRouter AI Configuration
talentflow.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
talentflow.ai.openrouter.model=${OPENROUTER_MODEL:openrouter/auto}
talentflow.ai.openrouter.base-url=https://openrouter.ai/api/v1


