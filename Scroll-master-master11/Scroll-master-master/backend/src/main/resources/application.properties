spring.application.name=talentflow-backend
server.port=${PORT:8081}

# Active profile: defaults to "mysql" (connected directly to MySQL Workbench scroll_master)
# Use "dev" for embedded H2 or "prod" for PostgreSQL.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# Multipart file upload limits (CVs & Company Logos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# File storage directory (local fallback + Firebase Storage integration)
talentflow.storage.upload-dir=uploads
talentflow.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
talentflow.firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:}
talentflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# OpenRouter AI Configuration
talentflow.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
talentflow.ai.openrouter.model=${OPENROUTER_MODEL:openrouter/auto}
talentflow.ai.openrouter.base-url=https://openrouter.ai/api/v1